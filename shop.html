<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop | HemAth</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>

<header class="site-header">
  <div class="container nav-container">
    <a href="index.html" class="logo">HemAth</a>

    <nav class="site-nav">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="artisans.html">Artisans</a>
      <a href="shop.html" class="active">Shop</a>
      <a href="contact.html">Contact</a>
    </nav>
  </div>
</header>

<section class="page-hero">
  <div class="container">
    <h1>Shop HemAth</h1>
    <p>Support artisans by purchasing handmade products</p>
  </div>
</section>

<section class="section">
  <div class="container">

    <h2>Shawls</h2>
    <div class="product-grid">

      <div class="product-card">
        <img src="Shawlgreen.JPG">
        <h3>Green Shawl</h3>
        <p>$25.99</p>
        <button class="add-to-cart" data-name="Green Shawl" data-price="25.99">Add to Cart</button>
      </div>

      <div class="product-card">
        <img src="Shawlred.JPG">
        <h3>Red Shawl</h3>
        <p>$25.99</p>
        <button class="add-to-cart" data-name="Red Shawl" data-price="25.99">Add to Cart</button>
      </div>

    </div>

    <h2>Aathors</h2>
    <div class="product-grid">

      <div class="product-card">
        <img src="Aathor1.JPG">
        <h3>Aathor</h3>
        <p>$20</p>
        <button class="add-to-cart" data-name="Aathor" data-price="20">Add to Cart</button>
      </div>

    </div>

    <h2>Khewa Tea</h2>
    <div class="product-grid">

      <div class="product-card">
        <img src="Kasmirigreenteakhewa.JPG">
        <h3>Khewa</h3>
        <p>$10</p>
        <button class="add-to-cart" data-name="Khewa" data-price="10">Add to Cart</button>
      </div>

    </div>

  </div>
</section>

<section class="section">
  <div class="container">
    <h2>Cart</h2>
    <div id="cart-items"></div>
    <h3>Total: $<span id="cart-total">0</span></h3>
    <button id="clear-cart">Clear Cart</button>
  </div>
</section>

<script src="script.js"></script>

</body>
</html>
